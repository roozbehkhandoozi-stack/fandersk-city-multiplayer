<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>فندرسک سیتی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
/* Layout: full-bleed 3D canvas, HUD pinned to the edges, modal cards for shops. Single dark look on purpose (night-city game UI). */
:root{
  --bg:#0d1219; --panel:#161d28; --panel2:#1f2938; --line:#2c3a50;
  --fg:#eef2f8; --mut:#9aabc2;
  --coin:#f3b63f; --gem:#2dd4c0; --ok:#56d98a; --bad:#f2705c;
  --font:'Vazirmatn',system-ui,'Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);direction:rtl;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit}
#hud{position:fixed;inset:0;pointer-events:none;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
  --gt:calc(env(safe-area-inset-top,0px) + 10px);--gb:calc(env(safe-area-inset-bottom,0px) + 14px)}
#top{position:absolute;top:var(--gt);left:var(--gl);right:var(--gr);display:flex;gap:8px;align-items:flex-start}
#stats{display:flex;flex-direction:column;gap:5px;flex:none;pointer-events:auto}
.chip{display:flex;align-items:center;gap:6px;background:rgba(13,18,25,.72);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13px;min-width:92px;backdrop-filter:blur(6px)}
.chip b{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.chip small{color:var(--mut);font-size:10.5px}
.chip svg{width:16px;height:16px;flex:none}
#obj{flex:1;min-width:0;background:rgba(13,18,25,.62);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.7;color:var(--fg);pointer-events:none}
#obj small{display:block;color:var(--gem);font-size:10.5px;font-weight:600}
#tl{display:flex;flex-direction:column;gap:6px;flex:none;pointer-events:auto;align-items:flex-start}
#mm{width:112px;height:112px;border-radius:12px;border:1px solid var(--line);background:#101820;display:block}
.minirow{display:flex;gap:5px}
.mini{background:rgba(13,18,25,.78);border:1px solid var(--line);border-radius:9px;font-size:12px;padding:6px 10px;cursor:pointer}
.mini:active{background:var(--panel2)}
#chatlog{position:absolute;left:var(--gl);bottom:calc(var(--gb) + 8px);width:min(300px,62vw);display:flex;flex-direction:column;gap:3px;pointer-events:none;font-size:12px}
body.touch #chatlog{bottom:calc(var(--gb) + 175px)}
#chatlog div{background:rgba(13,18,25,.6);border-radius:8px;padding:3px 8px;line-height:1.6;transition:opacity .6s;word-break:break-word}
#chatlog div b{color:var(--gem);font-weight:600}
#chatlog div.sys{color:var(--mut)}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--gb) + 112px);background:rgba(13,18,25,.86);border:1px solid var(--coin);color:var(--fg);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;max-width:80vw;text-align:center;pointer-events:auto}
#prompt kbd{background:var(--coin);color:#201600;border-radius:5px;padding:0 6px;margin-inline-start:8px;font-family:inherit;font-weight:800}
body.touch #prompt kbd{display:none}
#bChat{position:absolute;right:var(--gr);bottom:calc(var(--gb) + 102px);pointer-events:auto}
#joyZone{position:absolute;left:var(--gl);bottom:var(--gb);width:170px;height:170px;display:none;pointer-events:auto;touch-action:none}
body.touch #joyZone{display:block}
#joyBase{position:absolute;width:112px;height:112px;left:calc(var(--gl) + 29px);bottom:calc(var(--gb) + 29px);margin:0;border-radius:50%;border:2px solid rgba(238,242,248,.35);background:rgba(13,18,25,.35);pointer-events:none;opacity:0;transition:opacity .15s}
#joyKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(238,242,248,.55)}
#steer,#pedals{position:absolute;bottom:var(--gb);display:none;gap:12px;pointer-events:auto;touch-action:none}
#steer{left:var(--gl);flex-direction:row;direction:ltr}
#pedals{right:var(--gr);flex-direction:column}
body.touch.incar #steer,body.touch.incar #pedals{display:flex}
body.touch.incar #joyZone,body.touch.incar #joyBase{display:none!important}
.cb{width:78px;height:78px;border-radius:50%;border:2px solid rgba(238,242,248,.5);background:rgba(13,18,25,.55);font-size:22px;font-weight:800;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;touch-action:none;cursor:pointer;-webkit-touch-callout:none}
.cb small{font-size:12px;font-weight:700}
.cb.gas{border-color:var(--ok)}.cb.brk{border-color:var(--bad)}
.cb.on{background:rgba(238,242,248,.35)}.cb.gas.on{background:rgba(86,217,138,.45)}.cb.brk.on{background:rgba(242,112,92,.45)}
#chatForm{position:absolute;left:var(--gl);right:var(--gr);bottom:var(--gb);display:flex;gap:6px;pointer-events:auto}
#chatForm input{flex:1;min-width:0;font-family:inherit;font-size:15px;background:rgba(13,18,25,.92);border:1px solid var(--gem);color:var(--fg);border-radius:10px;padding:10px 12px;outline:none;-webkit-user-select:text;user-select:text}
#progWrap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--gb) + 112px);width:min(260px,70vw);text-align:center;font-size:13px;pointer-events:none}
#prog{height:10px;border-radius:99px;background:rgba(13,18,25,.8);border:1px solid var(--line);overflow:hidden;margin-top:6px}
#progBar{display:block;height:100%;width:0;background:var(--coin)}
#fps{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 4px);font-size:11px;color:var(--mut);background:rgba(13,18,25,.55);padding:2px 8px;border-radius:99px;pointer-events:none}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:3px;align-items:center;pointer-events:none;z-index:30;width:min(300px,80vw)}
.toast{background:rgba(22,29,40,.92);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:11px;line-height:1.5;text-align:center;animation:tin .25s ease-out}
.toast.ok{border-color:var(--ok)} .toast.gem{border-color:var(--gem)} .toast.bad{border-color:var(--bad)} .toast.coin{border-color:var(--coin)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#modal{position:fixed;inset:0;background:rgba(5,8,12,.62);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
#mcard{width:min(460px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
#mcard header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
#mcard h2{margin:0;font-size:17px;font-weight:800}
#pbody{padding:14px 16px 18px;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;-webkit-user-select:text;user-select:text}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer;font-weight:600}
.btn:active{filter:brightness(1.3)}
.btn.primary{background:var(--coin);border-color:var(--coin);color:#1d1400}
.btn.gem{background:var(--gem);border-color:var(--gem);color:#02221e}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.item .t b{font-size:15px}
.item .t span{font-size:12px;color:var(--mut)}
.tag{font-size:12px;color:var(--ok);font-weight:600;white-space:nowrap}
.note{font-size:12.5px;line-height:1.9;color:var(--mut)}
.seg{display:flex;gap:6px}
.seg .btn{flex:1;padding:9px 4px}
.seg .btn.on{background:var(--gem);border-color:var(--gem);color:#02221e}
.big{font-size:22px;font-weight:800}
#auth{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(8,12,20,.55),rgba(8,12,20,.82));
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;overflow-y:auto}
#acard{width:min(380px,100%);background:rgba(22,29,40,.94);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;touch-action:pan-y;margin:auto}
#acard h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.5px}
#acard h1 span{color:var(--coin)}
#acard p{margin:0;color:var(--mut);font-size:13px;line-height:1.8}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--panel2);border-color:var(--coin);color:var(--coin)}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mut)}
.field input{font-family:inherit;font-size:16px;background:#0f151e;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:11px 12px;outline:none;-webkit-user-select:text;user-select:text;direction:rtl}
.field input:focus{border-color:var(--coin)}
#aerr{min-height:20px;color:var(--bad);font-size:13px;line-height:1.7}
#astat{font-size:12px;color:var(--mut)}
#boot{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:15px}
#boot i{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--coin);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.toast,#boot i{animation:none}}
:focus-visible{outline:2px solid var(--gem);outline-offset:2px}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}
body.rot #stage{transform-origin:0 0;transform:rotate(90deg)}
#stats{display:grid;grid-template-columns:repeat(2,auto);gap:4px}
.chip{min-width:84px;padding:4px 8px}.chip span{font-size:14px}
#mcard{width:min(560px,100%)}
#acard{width:min(420px,100%);padding:16px 18px;gap:9px}
body.touch #chatlog{bottom:calc(var(--gb) + 110px)}
#top{justify-content:space-between}
#topbtns{display:flex;gap:6px;pointer-events:auto}
#bBag,#bShop{padding:4px 10px;line-height:1.2;position:relative;display:inline-flex;align-items:center;gap:5px}#bShop{font-size:12px}#bBag svg,#bShop svg{display:block}
.badge{position:absolute;top:-6px;inset-inline-end:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--coin);color:#201600;font:800 10.5px/17px var(--font);text-align:center;padding:0 3px;box-sizing:border-box}
#bBag.pop{animation:bpop .6s ease-out}
@keyframes bpop{30%{transform:scale(1.3);border-color:var(--coin)}100%{transform:none}}
.bag{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{aspect-ratio:1;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;cursor:pointer}
.slot.empty{background:transparent;border-style:dashed;opacity:.45;cursor:default}
.slot.on{border-color:var(--coin);box-shadow:0 0 0 1px var(--coin) inset}
.slot .ic{font-size:26px;line-height:1}.slot .ct{font-size:12px;font-variant-numeric:tabular-nums}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--gem)}
#modal.wd{background:transparent;justify-content:flex-start}
#modal.wd #mcard{width:min(300px,50%);background:rgba(22,29,40,.93)}
@media (prefers-reduced-motion:reduce){#bBag.pop{animation:none}}
/* joystick stays in one fixed spot (bottom-left) */
body.touch #joyBase{opacity:.65}
body.touch #chatlog{left:calc(var(--gl) + 180px);bottom:calc(var(--gb) + 8px);width:min(250px,36vw);max-height:76px;overflow:hidden;justify-content:flex-end}

#jail{position:absolute;top:var(--gt);left:50%;transform:translateX(-50%);background:rgba(120,24,24,.85);border:1px solid var(--bad);color:#fff;border-radius:999px;padding:6px 16px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap}
/* visible scrollbar beside every menu */
#pscroll{flex:1;min-height:0;display:flex;overflow:hidden}
#pbody{flex:1;min-width:0;min-height:0;scrollbar-width:none}
#pbody::-webkit-scrollbar{display:none}
#ptrack{flex:none;width:26px;margin:10px 4px 10px 6px;position:relative;border-radius:13px;background:rgba(255,255,255,.07);touch-action:none;display:none;cursor:grab}
#pthumb{position:absolute;left:6px;right:6px;top:0;border-radius:8px;background:var(--coin);opacity:.9;min-height:36px}
#ptrack.drag #pthumb{opacity:1;background:#ffd36a}
/* menus: animated open/close, bottom sheet on touch devices */
#modal{animation:mfade .18s ease-out}
#mcard{animation:mup .22s cubic-bezier(.2,.8,.25,1)}
#modal.out{animation:mfadeo .16s ease-in forwards;pointer-events:none}
#modal.out #mcard{animation:mdown .16s ease-in forwards}
@keyframes mfade{from{opacity:0}to{opacity:1}}
@keyframes mfadeo{to{opacity:0}}
@keyframes mup{from{transform:translateY(28px) scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes mdown{to{transform:translateY(28px) scale(.97);opacity:0}}
@keyframes msheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes msheetd{to{transform:translateY(100%)}}
#grab{display:none;width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none;touch-action:none}
#mcard header{touch-action:none}
#pclose{padding:8px 16px;font-size:13px}
body.touch #modal:not(.wd){align-items:flex-end;padding-bottom:0}
body.touch #modal:not(.wd) #mcard{border-radius:20px 20px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px);animation:msheet .26s cubic-bezier(.2,.8,.25,1)}
body.touch #modal.out:not(.wd) #mcard{animation:msheetd .18s ease-in forwards}
body.touch #modal:not(.wd) #grab{display:block}
@media (prefers-reduced-motion:reduce){#modal,#mcard,#modal.out,#modal.out #mcard,body.touch #modal #mcard{animation:none!important}}


/* HUD in the style of the reference screenshot */
#hud #top{position:static;display:block}
#hud .hb{position:absolute;pointer-events:auto;width:50px;height:52px;padding:0;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;color:#3b2200;font-family:inherit;font-size:9.5px;font-weight:800;line-height:1.1;border:2px solid #7a4a10;background:linear-gradient(#ffdc70,#f0a91f);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 0 #8a5a12,0 5px 8px rgba(0,0,0,.38)}
#hud .hb small{font-size:9.5px;font-weight:800}
#hud .hb:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 1px 0 #8a5a12}
#hud .hb.blue{width:44px;height:44px;border-color:#12408a;background:linear-gradient(#69b2ff,#1f6fe0);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 3px 0 #12408a,0 5px 8px rgba(0,0,0,.38)}
#hud .hbpill{position:absolute;pointer-events:auto;height:44px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:7px;cursor:pointer;font-family:inherit;color:#fff;font-size:15px;background:rgba(20,28,48,.85);border:2px solid #56688a}
#hud .hbpill b{font-weight:800;font-variant-numeric:tabular-nums}
#hud #bMenu{left:var(--gl);top:var(--gt)}
#hud #bOnline{left:calc(var(--gl) + 54px);top:var(--gt)}
#hud #tl{position:absolute;left:var(--gl);top:calc(var(--gt) + 56px)}
#hud #mm{width:92px;height:92px;border:2px solid #f0a91f;border-radius:12px}
#hud #bBag.pop{animation:bpop .6s ease-out}
#hud .badge{top:-7px;inset-inline-end:-6px}
#hud #stats{position:absolute;top:var(--gt);right:var(--gr);left:auto;display:flex;flex-direction:row;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:calc(100% - var(--gl) - var(--gr) - 150px)}
#hud .chip{min-width:0;height:34px;padding:0 10px;gap:7px;border-radius:9px;background:rgba(18,26,56,.9);border:2px solid var(--line);box-sizing:border-box}
#hud .chip small{display:none}
#hud .chip svg{width:20px;height:20px}
#hud .chip span{font-size:17px;line-height:1}
#hud .chip b{font-size:15px}
#hud .chip:nth-child(1){border-color:#f3b63f}
#hud .chip:nth-child(2){border-color:#34d399}
#hud .chip:nth-child(3){border-color:#9aabc2}
#hud .chip:nth-child(4){border-color:#4aa3ff}
/* right-side slide-out drawer */
#hud #drawer{position:absolute;right:0;top:calc(var(--gt) + 88px);display:flex;flex-direction:row-reverse;align-items:flex-start;pointer-events:none;transform:translateX(calc(100% - 26px));transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#hud #drawer.open{transform:none}
@media (orientation:landscape){#hud #drawer{top:calc(var(--gt) + 46px)}}
#hud #dTab{pointer-events:auto;position:relative;width:26px;height:60px;margin-top:6px;padding:0;border:2px solid #7a4a10;border-right:0;border-radius:12px 0 0 12px;background:linear-gradient(#ffdc70,#f0a91f);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 8px rgba(0,0,0,.38);cursor:pointer;display:flex;align-items:center;justify-content:center}
#hud #dTab svg{transition:transform .28s}
#hud #drawer.open #dTab svg{transform:rotate(180deg)}
#hud #dTab .dot{position:absolute;top:-5px;left:-5px;width:14px;height:14px;border-radius:50%;background:#e4572e;border:2px solid #fff}
#hud #dBody{pointer-events:auto;display:flex;flex-direction:column;gap:8px;padding:10px calc(var(--gr) - 4px) 10px 10px;background:rgba(20,28,48,.88);border:2px solid #f0a91f;border-right:0;border-radius:0 0 0 14px;border-top-width:2px}
#hud #dBody .hb{position:relative;left:auto;right:auto;top:auto;bottom:auto;width:48px;height:50px}
/* joystick, chat and action button make room for the left button column */
@media (prefers-reduced-motion:reduce){#hud #bBag.pop{animation:none}}

/* ===== character select screen (opened from the side drawer) ===== */
#modal.chars{background:rgba(4,7,12,.84);align-items:stretch!important;justify-content:stretch;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))!important}
#modal.chars #mcard{width:100%!important;max-height:none!important;height:100%;background:transparent;border:0;border-radius:0!important;overflow:visible;animation:none!important;padding-bottom:0!important;transform:none!important}
#modal.chars #mcard header,#modal.chars #grab,#modal.chars #ptrack{display:none!important}
#modal.chars #pscroll{overflow:visible}
#modal.chars #pbody{padding:0;overflow:visible;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
.cs{display:flex;gap:10px;height:100%;direction:ltr}
.cs-l{flex:0 0 40%;max-width:340px;min-width:0;display:flex;flex-direction:column;background:#431409;border:2px solid #1c0a05;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,160,70,.22)}
.cs-h{position:relative;display:flex;align-items:center;justify-content:center;min-height:42px;padding:4px 8px;flex:none;direction:rtl}

<script>
/* Fandersk City public multiplayer compatibility layer */
(function(){
'use strict';
var handlers={}, peerHandlers=[], connHandlers=[], ws=null, connected=false, myId=null, lastPeers=[];
function notifyConn(v){connected=v;connHandlers.forEach(function(f){try{f(v)}catch(e){}})}
function connect(){
  if(ws && (ws.readyState===0||ws.readyState===1)) return;
  var proto=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(proto+'//'+location.host+'/ws');
  ws.onopen=function(){notifyConn(true)};
  ws.onclose=function(){notifyConn(false);setTimeout(connect,1500)};
  ws.onerror=function(){};
  ws.onmessage=function(ev){
    var m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.type==='hello'){myId=m.id;return}
    if(m.type==='peers'){lastPeers=m.peers||[];peerHandlers.forEach(function(f){try{f({peers:lastPeers})}catch(e){}});return}
    if(m.type==='event'&&handlers[m.event])handlers[m.event].forEach(function(f){try{f({data:m.data})}catch(e){}})
  }
}
function send(o){return new Promise(function(resolve,reject){
  function go(){try{ws.send(JSON.stringify(o));resolve()}catch(e){reject(e)}}
  if(ws&&ws.readyState===1)return go();connect();var n=0,t=setInterval(function(){if(ws&&ws.readyState===1){clearInterval(t);go()}else if(++n>40){clearInterval(t);reject(new Error('offline'))}},100)
})}
connect();
var room={
  onConnection:function(ok){connHandlers.push(ok);try{ok(connected)}catch(e){}},
  on:function(name,fn){(handlers[name]||(handlers[name]=[])).push(fn)},
  onPeers:function(fn){peerHandlers.push(fn);try{fn({peers:lastPeers})}catch(e){}},
  emit:function(name,data){return send({type:'event',event:name,data:data})},
  presence:function(data){return send({type:'presence',data:data})}
};
function api(path,opt){return fetch(path,Object.assign({headers:{'Content-Type':'application/json'}},opt||{})).then(async function(r){var j=await r.json().catch(function(){return {}});if(!r.ok)throw new Error(j.error||'server error');return j})}
function doc(path){return {
  get:function(){return api('/api/doc?path='+encodeURIComponent(path)).then(function(j){return {exists:j.exists,data:function(){return j.data}}})},
  set:function(data){return api('/api/doc',{method:'POST',body:JSON.stringify({path:path,data:data})})},
  update:function(data){return api('/api/doc',{method:'PATCH',body:JSON.stringify({path:path,data:data})})},
  acquire:function(o){return api('/api/lock',{method:'POST',body:JSON.stringify({path:path,holder:o.holder,ttlMs:o.ttlMs})})}
}}
var db={doc:doc}, user={can:function(){return Promise.resolve(true)}};
window.claude={use:function(name){if(name==='room')return Promise.resolve(room);if(name==='db')return Promise.resolve(db);if(name==='user')return Promise.resolve(user);return Promise.reject(new Error('unknown capability'))}};
})();

  else pl.speed=lerp(pl.speed,0,1-Math.exp(-dt*10));
  tmpV.x=pl.x;tmpV.z=pl.z;resolve(tmpV,0.45);pl.x=tmpV.x;pl.z=tmpV.z;
  for(var j=0;j<traffic.length;j++){var tc=traffic[j];if(!tc.g.visible)continue;var ex=pl.x-tc.x,ez=pl.z-tc.z,ed=Math.hypot(ex,ez);if(ed<1.9&&ed>0.01){pl.x+=ex/ed*(1.9-ed);pl.z+=ez/ed*(1.9-ed)}}
  pl.ph+=dt*pl.speed*2.6;pl.model.position.set(pl.x,GY,pl.z);pl.model.rotation.y=pl.heading;animChar(pl.model,pl.ph,clamp(pl.speed/4.5,0,1.3),false,t)}
function updateTraffic(dt){
  for(var i=0;i<traffic.length;i++){
    var c=traffic[i];if(!c.g.visible)continue;
    var fx=Math.sin(c.yaw),fz=Math.cos(c.yaw),blocked=false;
    function chk(ox,oz){var dx=ox-c.x,dz=oz-c.z,dot=dx*fx+dz*fz;if(dot>0.5&&dot<9&&Math.abs(dx*fz-dz*fx)<2.3)blocked=true}
    for(var j=0;j<traffic.length;j++){if(j!==i&&traffic[j].g.visible)chk(traffic[j].x,traffic[j].z)}
    if(playing){if(myCar&&(inCar||true))chk(myCar.x,myCar.z);if(!inCar)chk(pl.x,pl.z)}
    remotes.forEach(function(r){if(r.pos)chk(r.pos.x,r.pos.z)});
    if(blocked&&c.stall<3)c.stall+=dt;else if(!blocked)c.stall=0;
    if(c.stall>=3){c.stall+=dt;if(c.stall>5)c.stall=0;blocked=false}
    c.speed=lerp(c.speed,blocked?0:c.v,1-Math.exp(-dt*(blocked?5:1.4)));
    if(c.axis==='x'){c.x+=c.dir*c.speed*dt;if(c.x>H-3)c.x=-H+3;if(c.x<-H+3)c.x=H-3}else{c.z+=c.dir*c.speed*dt;if(c.z>H-3)c.z=-H+3;if(c.z<-H+3)c.z=H-3}
    c.g.position.set(c.x,GY,c.z);c.g.rotation.y=c.yaw;spinCar(c.g,c.speed,0,dt)}}
function updatePeds(dt,t){
  for(var i=0;i<peds.length;i++){
    var p=peds[i];if(!p.g.visible)continue;
    p.s+=p.dir*p.spd*dt;var a=perimPos(p.cx,p.cz,p.h,p.s),b=perimPos(p.cx,p.cz,p.h,p.s+p.dir*0.6);
    p.g.position.set(a[0],GY,a[1]);p.g.rotation.y=Math.atan2(b[0]-a[0],b[1]-a[1]);p.ph+=dt*p.spd*3.2;animChar(p.g,p.ph,0.6,false,t)}}
function updateNpcs(dt,t){
  for(var i=0;i<npcs.length;i++){
    var n=npcs[i],d=Math.hypot(pl.x-n.x,pl.z-n.z);
    if(d<14)n.g.rotation.y=angLerp(n.g.rotation.y,Math.atan2(pl.x-n.x,pl.z-n.z),1-Math.exp(-dt*5));
    n.g.userData.head.rotation.z=Math.sin(t*1.3+n.ph)*0.06;n.g.userData.armL.rotation.x=Math.sin(t*1.1+n.ph)*0.07;
    if(d<9){n.g.userData.armR.rotation.x=-2.6+Math.sin(t*5+n.ph)*0.35}else n.g.userData.armR.rotation.x=Math.sin(t*1.1+n.ph+1)*0.07}}
function updateMarkers(t){
  for(var i=0;i<markers.length;i++){
    var a=markers[i],own=a.type!=='work'||G.jobs.indexOf(a.job)>=0;
    a.gem.rotation.y=t*1.8;a.gem.position.y=2.1+Math.sin(t*2+i)*0.18;a.ring.material.opacity=own?(0.65+Math.sin(t*3+i)*0.2):0.28;a.gem.visible=own||false}}
function updateCamera(dt){
  if(wardrobe){wdA+=dt*0.6;camYaw=pl.heading+Math.PI+Math.sin(wdA)*0.9;camPitch=0.12;camDist=3.4}
  var tx=pl.x,ty=GY+(inCar?1.2:1.5),tz=pl.z,cp=Math.cos(camPitch),sp=Math.sin(camPitch),dist=camDist;
  var dx=tx-Math.sin(camYaw)*cp*dist,dy=ty+sp*dist,dz=tz-Math.cos(camYaw)*cp*dist;
  var k=1-Math.exp(-dt*12);camera.position.x+=(dx-camera.position.x)*k;camera.position.y+=(dy-camera.position.y)*k;camera.position.z+=(dz-camera.position.z)*k;
  if(curIns){var b=curIns;camera.position.x=clamp(camera.position.x,b.x0+0.8,b.x1-0.8);camera.position.z=clamp(camera.position.z,b.z0+0.8,b.z1-0.8);camera.position.y=Math.min(camera.position.y,b.h-0.5)}
  if(camera.position.y<0.6)camera.position.y=0.6;camera.lookAt(tx,ty+0.2,tz)}
function frame(now){
  requestAnimationFrame(frame);
  try{
    var dt=Math.min(0.05,(now-last)/1000);last=now;tAll+=dt;
    updateSky();updateInside();updateCarUI();
    if(playing&&pl.model){
      updatePlayer(dt,tAll);updateCamera(dt);sendPresence(now);
      if(now-objT>400){objT=now;tickEnergy();if(G.jailUntil&&!isJailed())releaseJail();updateJailHUD();updatePrompt();if(!working)updateHUD()}
      if(now-mmT>120){mmT=now;if(!mmBase)mmBase=drawBase(448,false);drawMini(mmCtx,448,mmBase)}
    }else{
      menuAng+=dt*0.05;camera.position.set(Math.sin(menuAng)*78,34,Math.cos(menuAng)*78);camera.lookAt(0,4,0);pl.x=0;pl.z=0}
    updateTraffic(dt);updatePeds(dt,tAll);updateNpcs(dt,tAll);updateMarkers(tAll);patrolAnim(tAll);updatePatrol();updateRemotes(dt,tAll);
    renderer.render(scene,camera);
    fpsN++;fpsT+=dt;
    if(fpsT>=3){var fps=fpsN/fpsT;fpsN=0;fpsT=0;if(S.fps)$('#fps').textContent='FPS: '+Math.round(fps)+' | کیفیت: '+QS[S.q].name;
      if(S.auto&&S.q>0&&fps<24){lowRuns++;if(lowRuns>=2){lowRuns=0;S.q--;saveS();applyQuality();toast('بازی کند بود؛ کیفیت گرافیک به «'+QS[S.q].name+'» کاهش یافت.','')}}else lowRuns=0}
  }catch(err){console.error(err)}}

/* ================= boot ================= */
async function boot(){
  try{await Promise.race([document.fonts.load('800 40px Vazirmatn','مزرعه بانک'),new Promise(function(r){setTimeout(r,2500)})])}catch(e){}
  buildWorld();initTraffic();initPeds();
  mmBase=null;onResize();applyQuality();updateSky();
  $('#boot').hidden=true;$('#auth').hidden=false;
  requestAnimationFrame(frame);
  /* capabilities (online features) */
  var st=$('#astat'),done=false;
  var tmo=setTimeout(function(){if(!done){st.textContent='سرور بازی پاسخ نداد. فقط ورود مهمان ممکن است.'}},12000);
  try{
    if(window.claude&&window.claude.use){
      var r=await Promise.all([window.claude.use('db').catch(function(){return null}),window.claude.use('room').catch(function(){return null}),window.claude.use('user').catch(function(){return null})]);
      db=r[0];room=r[1];userCap=r[2]}}catch(e){}
  done=true;clearTimeout(tmo);
  st.textContent=db?(room?'متصل به شهر آنلاین':'ذخیره آنلاین فعال است؛ بازی چندنفره در این نمایش فعال نیست.'):'ذخیره آنلاین در دسترس نیست؛ فقط ورود مهمان ممکن است.';
}
boot();
})();
